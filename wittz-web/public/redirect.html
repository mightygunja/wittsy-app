<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Wittz...</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #6C63FF; color: #fff;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p  { font-size: 16px; opacity: 0.85; margin-bottom: 32px; max-width: 320px; }
    .btn-primary { background: #fff; color: #6C63FF; font-weight: 700; font-size: 16px;
                   padding: 14px 32px; border-radius: 14px; text-decoration: none;
                   display: inline-block; margin-bottom: 16px; }
    .btn-secondary { color: #fff; font-size: 14px; opacity: 0.75; text-decoration: underline; }
    #status { font-size: 14px; opacity: 0.7; margin-bottom: 24px; min-height: 20px; }
  </style>
</head>
<body>
  <h1>⚡ Opening Wittz...</h1>
  <p id="message">Taking you to the game room now.</p>
  <p id="status"></p>
  <a id="storeBtn" class="btn-primary" href="https://apps.apple.com/us/app/wittz-party-word-game/id6757277835" style="display:none">Get Wittz on the App Store</a>
  <a id="openBtn" class="btn-secondary" href="https://apps.apple.com/us/app/wittz-party-word-game/id6757277835" style="display:none">Open App Store manually</a>

  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/us/app/wittz-party-word-game/id6757277835';

      // Parse path: /game/{roomId} or /group/{inviteCode}
      var parts = window.location.pathname.split('/').filter(Boolean);
      var type  = parts[0]; // 'game' or 'group'
      var id    = parts[1]; // roomId or inviteCode

      if (!type || !id) {
        // No valid deep link — just go to App Store
        window.location.replace(APP_STORE);
        return;
      }

      var customScheme = 'wittsy://' + type + '/' + id;
      var appOpened    = false;
      var redirected   = false;

      function goToAppStore() {
        if (redirected) return;
        redirected = true;
        document.getElementById('message').textContent =
          'Wittz is not installed or needs an update. Get the latest version to join this room.';
        document.getElementById('status').textContent = 'Redirecting to the App Store...';
        document.getElementById('storeBtn').style.display = 'inline-block';
        document.getElementById('openBtn').style.display = 'none';
        // Give the user a moment to read the message, then redirect
        setTimeout(function () {
          window.location.replace(APP_STORE);
        }, 1500);
      }

      // If the page goes hidden, the custom scheme opened the app successfully
      function onVisibilityChange() {
        if (document.hidden) {
          appOpened = true;
        }
      }
      document.addEventListener('visibilitychange', onVisibilityChange);
      window.addEventListener('pagehide', function () { appOpened = true; });

      // Attempt to open the app via custom scheme
      window.location.href = customScheme;

      // After 2.5 s, check if the app opened. If not, go to App Store.
      setTimeout(function () {
        document.removeEventListener('visibilitychange', onVisibilityChange);
        if (!appOpened && !document.hidden) {
          goToAppStore();
        }
      }, 2500);

      // Fallback manual button (shown immediately for users who want to act now)
      setTimeout(function () {
        if (!appOpened) {
          var btn = document.getElementById('openBtn');
          btn.href = customScheme;
          btn.textContent = 'Open in Wittz';
          btn.style.display = 'inline-block';
        }
      }, 500);
    })();
  </script>
</body>
</html>
